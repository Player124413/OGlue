name: Build SonicHeroesPC

# Rebuilds the executable from the generated C already committed in src/recomp/gen.
# No ISO and no game assets are needed or downloaded: this only compiles source.
on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: 'Parallel MSVC jobs (lower = less memory)'
        required: false
        default: '2'
        type: choice
        options: ['2', '4', '1']
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'oglue/src/**'
      - 'oglue/include/**'
      - 'CMakeLists.txt'
      - 'oglue/CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'oglue/src/**'
      - 'oglue/include/**'
      - 'CMakeLists.txt'
      - 'oglue/CMakeLists.txt'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        env:
          BUILD_JOBS: ${{ inputs.build_jobs || '2' }}
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --target SonicHeroesPC --parallel "$env:BUILD_JOBS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package executable (no game assets)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build/Release/SonicHeroesPC.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw 'Not an x64 PE' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe dist/
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $xbeHash = ''
          if (Test-Path 'BUILD-INFO.json') {
            $xbeHash = (Get-Content 'BUILD-INFO.json' -Raw | ConvertFrom-Json).xbe.sha256
          }
          @(
            '# Adding your game files',
            '',
            'This artifact is the executable only. No game assets are included.',
            'Create a `game` folder next to the EXE and extract your own Sonic Heroes',
            'disc into it, so that `game\default.xbe` exists.',
            '',
            "Required SHA-256 of default.xbe: $xbeHash",
            '',
            'The host refuses to run if the hash differs: the executable was',
            'recompiled from that specific dump.',
            '',
            "Extraction command (from the repository root, needs Python 3.10+):",
            '  python -m pip install -r oglue/tools/ci/requirements.txt',
            '  cd oglue',
            '  python -m tools.xiso unpack "C:\path\to\your.iso" -o "<folder with the EXE>\game"',
            '',
            "Executable SHA-256: $hash"
          ) | Set-Content -Path 'dist/HOW-TO-ADD-GAME-FILES.md' -Encoding UTF8
          @(
            'Compiles the committed generated C. It does not run the game:',
            'playability is NOT tested by this workflow.'
          ) | Set-Content -Path 'dist/BUILD-NOTE.txt' -Encoding UTF8

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SonicHeroesPC-Windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Run summary
        shell: pwsh
        run: |
          @(
            '## SonicHeroesPC',
            '',
            '- Compiled and linked the committed generated C with MSVC x64.',
            '- Artifact: **SonicHeroesPC-Windows-x64** (executable only, no assets).',
            '- Runtime and playability were **not** tested.'
          ) | ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_ }
